rootProject.name = 'poker-gg'

dependencyResolutionManagement {
    versionCatalogs {
        reactAndroidLibs {
            from(files(new File(
                ["node", "--print", "require.resolve('react-native/package.json')"]
                    .execute(null, rootDir)
                    .text
                    .trim(),
                "../gradle/libs.versions.toml"
            )))
        }
    }
}

def expoPackageJson = ["node", "--print", "require.resolve('expo/package.json')"]
    .execute(null, rootDir)
    .text
    .trim()

if (expoPackageJson && expoPackageJson != "/") {
    apply from: new File(expoPackageJson, "../scripts/autolinking.gradle")
}

useExpoModules()

def cliPackageJson = ["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"]
    .execute(null, rootDir)
    .text
    .trim()

if (cliPackageJson && cliPackageJson != "/") {
    apply from: new File(cliPackageJson, "../native_modules.gradle")
}

applyNativeModulesSettingsGradle(settings)

include ':app'

def rnGradlePlugin = ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"]
    .execute(null, rootDir)
    .text
    .trim()

if (rnGradlePlugin && rnGradlePlugin != "/") {
    includeBuild(new File(rnGradlePlugin).getParentFile())
}
